name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (logic core only — no GPU stack in CI)
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: ruff check patchguard tests
      - name: Typecheck
        run: mypy patchguard
      - name: Test (CPU, fast)
        run: python -m pytest
